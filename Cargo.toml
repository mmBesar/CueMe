[workspace]
resolver = "2"
members = ["crates/cue-android","crates/cue-core", "crates/cue-hub"]
default-members = ["crates/cue-core", "crates/cue-hub", "crates/cue-android"]
exclude = ["src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/mmBesar/CueMe"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
panic = "abort"
