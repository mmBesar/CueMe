[package]
name = "cue-hub"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
cue-core = { version = "0.1.0", path = "../cue-core" }
futures-util = "0.3.34"
qrcode = "0.14.1"
rust-embed = { version = "8.13.0", features = ["debug-embed"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "net", "time", "signal"] }
tower-http = { version = "0.7.1", features = ["cors"] }

socket2 = { version = "0.6", features = ["all"] }

[dev-dependencies]
reqwest = { version = "0.13.5", features = ["json"] }
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"

[lib]
name = "cue_hub"
path = "src/lib.rs"

[[bin]]
name = "cueme-serve"
path = "src/main.rs"
